name: Validate Listing Format

on:
  pull_request:
    paths:
      - README.md

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check internship table format
        run: python scripts/validate_table.py
