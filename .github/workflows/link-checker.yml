name: Weekly Broken Link Check

on:
  schedule:
    - cron: "0 2 * * 1"   # Every Monday 02:00 UTC (~09:00–11:00 across Asia)
  workflow_dispatch:        # Allow manual runs from the Actions tab

permissions:
  issues: write             # Needed to open the failure-report issue

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee link checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Check markdown files; retry to reduce false positives from rate limits
          args: >-
            --max-retries 3
            --retry-wait-time 5
            --timeout 20
            --user-agent "Mozilla/5.0 (compatible; InternshipLinkChecker/1.0)"
            --accept 200,203,206,301,302,308,403,429
            --exclude "issues/new/choose"
            README.md
          fail: false

      # Keep at most one open report: stale ones are noise, and the newest
      # run always supersedes them.
      - name: Close superseded link reports
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label automated-report --json number --jq '.[].number' \
            | xargs -r -I{} gh issue close {} --repo "$GITHUB_REPOSITORY" \
                --comment "Superseded by a newer link-check report."

      - name: Open issue if broken links found
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔗 Weekly link check: broken links detected"
          content-filepath: ./lychee/out.md
          labels: expired-link, automated-report

  # Deep-checks each listing (soft-404 detection) and opens a PR that marks
  # dead rows 🔴 Closed — a human reviews and merges; nothing is auto-deleted.
  autoClose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Mark dead listings as closed
        id: close
        run: |
          python scripts/check_links.py --fix | tee report.txt
          {
            echo "report<<EOF"
            cat report.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          rm report.txt

      - name: Open PR marking rows closed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Mark dead listings as closed (weekly link check)"
          title: "🔴 Auto-close: dead application links detected"
          body: |
            The weekly deep link check found listings whose application links
            appear dead or explicitly closed:

            ```
            ${{ steps.close.outputs.report }}
            ```

            Bot-blocked responses (401/403/429/503) are ignored, so these are
            high-confidence. Review and merge to mark the rows 🔴 Closed.
          branch: auto/close-dead-listings
          delete-branch: true
          labels: expired-link, automated-report
